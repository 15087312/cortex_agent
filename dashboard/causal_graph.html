<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cortex Dashboard</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0d1117;color:#c9d1d9}
.hdr{padding:0 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;height:44px}
.hdr h1{font-size:14px;margin-right:20px}
.tabs{display:flex;gap:2px}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;color:#8b949e;border-bottom:2px solid transparent}
.tab:hover{color:#c9d1d9}.tab.on{color:#58a6ff;border-bottom-color:#58a6ff}
.toolbar{margin-left:auto;display:flex;gap:8px;align-items:center}
.toolbar input{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 8px;border-radius:4px;font-size:12px;width:140px}
.toolbar .btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.st{display:flex;gap:8px;font-size:11px;color:#8b949e;margin-left:12px}.st b{color:#58a6ff}
.page{display:none;height:calc(100vh - 44px)}.page.on{display:flex}
.g-wrap{display:flex;width:100%;height:100%}
#graph-svg{flex:1;background:#0d1117}
.side{width:300px;background:#161b22;border-left:1px solid #30363d;overflow-y:auto;padding:10px}
.side h3{font-size:11px;color:#8b949e;margin-bottom:6px;text-transform:uppercase}
.card{background:#21262d;border-radius:5px;padding:8px;margin-bottom:5px;border:1px solid transparent;font-size:12px;cursor:pointer}
.card:hover{border-color:#58a6ff}.card.hi{border-color:#58a6ff;background:#1c2333}
.card .cl{font-weight:600;margin-bottom:2px}.card .cm{color:#8b949e;font-size:10px;display:flex;gap:5px}
.nt{padding:1px 4px;border-radius:2px;font-size:9px}
.nt-root{background:#1f6feb33;color:#58a6ff}.nt-cause{background:#f0883e33;color:#f0883e}.nt-effect{background:#3fb95033;color:#3fb950}
.section{margin:8px 0}.section h4{font-size:10px;color:#8b949e;margin-bottom:4px;text-transform:uppercase}
.ev{padding:5px 8px;background:#0d1117;border-radius:3px;margin-bottom:3px;font-size:11px;line-height:1.3}
.imp{font-size:8px;padding:1px 3px;border-radius:2px;margin-left:3px}
.imp-h{background:#f0883e33;color:#f0883e}.imp-m{background:#d2992233;color:#d29922}
.ch{padding:6px 8px;background:#21262d;border-radius:4px;margin-bottom:4px;font-size:11px}
.ch-l{color:#8b949e;font-size:10px;margin-bottom:2px}
.arr{color:#58a6ff;margin:0 2px}
#tree-svg{flex:1;background:#0d1117}
#events-content{flex:1;padding:16px;overflow-y:auto}
</style>
</head>
<body>
<div class="hdr">
<h1>Cortex</h1>
<div class="tabs">
<div class="tab on" onclick="showPage('graph')">因果图</div>
<div class="tab" onclick="showPage('tree')">因果树</div>
<div class="tab" onclick="showPage('events')">事件</div>
</div>
<div class="st" id="st"></div>
<div class="toolbar">
<input type="text" id="search" placeholder="搜索..." oninput="filterNodes(this.value)">
<button class="btn" onclick="loadData()">刷新</button>
</div>
</div>

<div class="page on" id="graph-page"><div class="g-wrap">
<svg id="graph-svg"></svg>
<div class="side" id="g-side"><h3>节点</h3><div id="g-list"></div></div>
</div></div>

<div class="page" id="tree-page"><div class="g-wrap">
<svg id="tree-svg"></svg>
<div class="side" id="t-side"><h3>选择节点查看因果树</h3></div>
</div></div>

<div class="page" id="events-page"><div id="events-content"></div></div>

<script>
const TC={root:'#58a6ff',cause:'#f0883e',effect:'#3fb950',condition:'#a371f7'};
let D=null,curPage='graph',selId=null,filter='';
let sim=null,lastTreeData=null;

async function api(p){const r=await fetch(p);const j=await r.json();if(!j.success)throw j;return j.data}

async function loadData(){
  try{
    D=await api('/management/causal-graph');
    const s=D.stats;
    document.getElementById('st').innerHTML=`节点 <b>${s.total_nodes}</b> 边 <b>${s.total_edges}</b> 事件 <b>${s.total_events}</b>`;
    renderGList();renderEvents();
    if(curPage==='graph')renderGraph();
  }catch(e){console.error(e)}
}

function showPage(p){
  curPage=p;selId=null;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['graph','tree','events'][i]===p));
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.getElementById(p+'-page').classList.add('on');
  if(p==='graph')renderGraph();
  if(p==='tree'&&lastTreeData){
    // 有缓存数据时，延迟渲染确保 DOM 尺寸就绪
    requestAnimationFrame(()=>{drawTreeSVG(lastTreeData.detail,lastTreeData.tree);});
    renderTreeSide(lastTreeData.detail,lastTreeData.tree);
  } else if(p==='tree'){
    document.getElementById('t-side').innerHTML='<h3>在图页面点击节点查看因果树</h3>';
  }
  if(p==='events')renderEvents();
}

function filterNodes(q){filter=q.toLowerCase();renderGList();}

/* ===== D3 力导向图 ===== */
function renderGraph(){
  const svg=d3.select('#graph-svg');
  svg.selectAll('*').remove();
  const container=document.getElementById('graph-svg').parentElement;
  const W=container.clientWidth,H=container.clientHeight;
  svg.attr('width',W).attr('height',H);

  const g=svg.append('g').attr('transform',`translate(${W/2},${H/2})`);
  const zoom=d3.zoom().scaleExtent([0.2,5]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);

  const nodes=D.nodes.map(n=>({...n}));
  const links=D.edges.map(e=>({source:e.from,target:e.to,relation:e.relation,confidence:e.confidence}));

  sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(120))
    .force('charge',d3.forceManyBody().strength(-300))
    .force('center',d3.forceCenter(0,0))
    .force('collision',d3.forceCollide(30));

  // 边
  const link=g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke',d=>d.relation==='causes'?'#3fb950':'#f0883e')
    .attr('stroke-width',1.5).attr('marker-end','url(#arrow)');

  // 箭头
  svg.append('defs').append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10')
    .attr('refX',20).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-5L10,0L0,5').attr('fill','#3fb950');

  // 节点
  const node=g.append('g').selectAll('g').data(nodes).join('g').call(
    d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;})
  );

  node.append('circle').attr('r',d=>d.type==='root'?12:8+d.confidence*5)
    .attr('fill',d=>selId===d.id?'#fff':TC[d.type]||'#8b949e')
    .attr('stroke',d=>selId===d.id?'#58a6ff':TC[d.type]||'#8b949e')
    .attr('stroke-width',2).style('cursor','pointer')
    .on('click',(e,d)=>{
      e.stopPropagation();
      clickNode(d.id);
      node.select('circle').attr('fill',n=>n.id===d.id?'#fff':TC[n.type]||'#8b949e')
        .attr('stroke',n=>n.id===d.id?'#58a6ff':TC[n.type]||'#8b949e');
    });

  node.append('text').text(d=>d.label).attr('dy',d=>(d.type==='root'?12:8+d.confidence*5)+12)
    .attr('text-anchor','middle').attr('fill','#c9d1d9').attr('font-size','10px');

  // 点击空白取消选中
  svg.on('click',()=>{
    if(d3.event && d3.event.target.tagName === 'svg'){
      selId=null;renderGList();
      node.select('circle').attr('fill',n=>TC[n.type]||'#8b949e')
        .attr('stroke',n=>TC[n.type]||'#8b949e');
      document.getElementById('g-side').innerHTML='<h3>节点</h3><div id="g-list"></div>';renderGList();
    }
  });

  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

function renderGList(){
  const items=D.nodes.filter(n=>!filter||n.label.toLowerCase().includes(filter));
  document.getElementById('g-list').innerHTML=items.map(n=>
    `<div class="card${selId===n.id?' hi':''}" onclick="clickNode('${n.id}')">
      <div class="cl">${n.label}</div>
      <div class="cm"><span class="nt nt-${n.type}">${n.type}</span>${(n.confidence*100).toFixed(0)}% ${n.event_count}事件</div>
    </div>`
  ).join('');
}

async function clickNode(id){
  selId=id;renderGList();
  const side=document.getElementById('g-side');
  side.innerHTML='<h3>加载中...</h3>';
  try{
    const[detail,tree]=await Promise.all([
      api(`/management/causal-graph/${id}`),
      api(`/management/causal-graph/tree/${id}?depth=3`)
    ]);
    const n=detail.node;
    let h=`<h3>${n.label}</h3>`;
    h+=`<div style="font-size:11px;color:#8b949e;margin-bottom:8px"><span class="nt nt-${n.type}">${n.type}</span> ${(n.confidence*100).toFixed(0)}% · ${n.event_count}事件</div>`;
    if(detail.predecessors.length){
      h+=`<div class="section"><h4>← 前驱</h4>`;
      detail.predecessors.forEach(p=>{h+=`<div class="card" onclick="clickNode('${p.id}')"><div class="cl">${p.label}</div></div>`;});
      h+=`</div>`;
    }
    if(detail.successors.length){
      h+=`<div class="section"><h4>→ 后继</h4>`;
      detail.successors.forEach(s=>{h+=`<div class="card" onclick="clickNode('${s.id}')"><div class="cl">${s.label}</div></div>`;});
      h+=`</div>`;
    }
    if(tree.trace_up.length){
      h+=`<div class="section"><h4>↑ 溯源链</h4>`;
      tree.trace_up.forEach(c=>{h+=`<div class="ch">${c.nodes.map(n2=>`<b>${n2.label}</b>`).join(' <span class="arr">←</span> ')}</div>`;});
      h+=`</div>`;
    }
    if(tree.trace_down.length){
      h+=`<div class="section"><h4>↓ 预测链</h4>`;
      tree.trace_down.forEach(c=>{h+=`<div class="ch"><b>${n.label}</b> <span class="arr">→</span> ${c.nodes.map(n2=>`<b>${n2.label}</b>`).join(' <span class="arr">→</span> ')}</div>`;});
      h+=`</div>`;
    }
    // 缓存树数据并切换到因果树 tab
    lastTreeData={detail,tree};
    showPage('tree');
  }catch(e){side.innerHTML='<div style="color:#f85149">加载失败</div>';}
}

function renderTreeSide(detail,tree){
  const n=detail.node;
  let h=`<h3>${n.label} 因果树</h3>`;
  h+=`<div style="font-size:11px;color:#8b949e;margin-bottom:8px"><span class="nt nt-${n.type}">${n.type}</span> ${(n.confidence*100).toFixed(0)}% · ${n.event_count}事件</div>`;
  if(tree.trace_up.length){
    h+=`<div class="section"><h4>↑ 溯源链</h4>`;
    tree.trace_up.forEach(c=>{h+=`<div class="ch">${c.nodes.map(n2=>`<b>${n2.label}</b>`).join(' <span class="arr">←</span> ')}</div>`;});
    h+=`</div>`;
  }
  if(tree.trace_down.length){
    h+=`<div class="section"><h4>↓ 预测链</h4>`;
    tree.trace_down.forEach(c=>{h+=`<div class="ch"><b>${n.label}</b> <span class="arr">→</span> ${c.nodes.map(n2=>`<b>${n2.label}</b>`).join(' <span class="arr">→</span> ')}</div>`;});
    h+=`</div>`;
  }
  if(detail.linked_events.length){
    h+=`<div class="section"><h4>关联事件</h4>`;
    detail.linked_events.slice(0,5).forEach(e=>{const cls=e.importance>=0.7?'imp-h':'imp-m';h+=`<div class="ev">${e.fact}<span class="imp ${cls}">${e.type}</span></div>`;});
    h+=`</div>`;
  }
  document.getElementById('t-side').innerHTML=h;
}

/* ===== 因果树 ===== */
async function showTree(id){
  const side=document.getElementById('t-side');
  side.innerHTML='<h3>加载中...</h3>';
  try{
    const[detail,tree]=await Promise.all([
      api(`/management/causal-graph/${id}`),
      api(`/management/causal-graph/tree/${id}?depth=3`)
    ]);
    drawTreeSVG(detail,tree);
    let h=`<h3>${detail.node.label} 因果树</h3>`;
    if(tree.trace_up.length){
      h+=`<div class="section"><h4>↑ 溯源</h4>`;
      tree.trace_up.forEach(c=>{h+=`<div class="ch">${c.nodes.map(n=>`<b>${n.label}</b>`).join(' <span class="arr">←</span> ')}</div>`;});
      h+=`</div>`;
    }
    if(tree.trace_down.length){
      h+=`<div class="section"><h4>↓ 预测</h4>`;
      tree.trace_down.forEach(c=>{h+=`<div class="ch"><b>${detail.node.label}</b> <span class="arr">→</span> ${c.nodes.map(n=>`<b>${n.label}</b>`).join(' <span class="arr">→</span> ')}</div>`;});
      h+=`</div>`;
    }
    if(detail.linked_events.length){
      h+=`<div class="section"><h4>关联事件</h4>`;
      detail.linked_events.slice(0,5).forEach(e=>{
        const cls=e.importance>=0.7?'imp-h':'imp-m';
        h+=`<div class="ev">${e.fact}<span class="imp ${cls}">${e.type}</span></div>`;
      });
      h+=`</div>`;
    }
    side.innerHTML=h;
  }catch(e){side.innerHTML='<div style="color:#f85149">加载失败</div>';}
}

function drawTreeSVG(d,t){
  const svg=d3.select('#tree-svg');
  svg.selectAll('*').remove();
  const container=document.getElementById('tree-svg').parentElement;
  const W2=container.clientWidth,H2=container.clientHeight||400;
  svg.attr('width',W2).attr('height',H2);

  const nodes=[],links=[];const seen=new Set();
  const a=d.node;
  nodes.push({id:a.id,label:a.label,type:a.type,level:0,side:'center'});seen.add(a.id);

  t.trace_up.forEach((ch,ci)=>{ch.nodes.forEach((n,i)=>{
    if(!seen.has(n.id)){nodes.push({id:n.id,label:n.label,type:n.type,level:-(i+1),side:'left'});seen.add(n.id);}
  });});
  t.trace_down.forEach((ch,ci)=>{ch.nodes.forEach((n,i)=>{
    if(!seen.has(n.id)){nodes.push({id:n.id,label:n.label,type:n.type,level:i+1,side:'right'});seen.add(n.id);}
  });});

  // 布局：左=溯源，中=锚点，右=预测
  const levelGroups={};
  nodes.forEach(n=>{const key=n.level;if(!levelGroups[key])levelGroups[key]=[];levelGroups[key].push(n);});
  Object.entries(levelGroups).forEach(([lvl,ns])=>{
    const l=parseInt(lvl);
    const x=l*160;
    ns.forEach((n,i)=>{n.x=x;n.y=H2/2+(i-ns.length/2)*60;});
  });

  // 边
  t.trace_up.forEach(ch=>{for(let i=0;i<ch.nodes.length-1;i++){
    links.push({source:ch.nodes[i].id,target:ch.nodes[i+1].id,dir:'up'});}
    if(ch.nodes.length)links.push({source:ch.nodes[ch.nodes.length-1].id,target:a.id,dir:'up'});});
  t.trace_down.forEach(ch=>{let prev=a.id;
    ch.nodes.forEach(n=>{links.push({source:prev,target:n.id,dir:'down'});prev=n.id;});});

  const g=svg.append('g');
  const zoom2=d3.zoom().scaleExtent([0.3,3]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom2);

  const nodeMap={};nodes.forEach(n=>nodeMap[n.id]=n);

  g.append('g').selectAll('line').data(links).join('line')
    .attr('x1',d=>nodeMap[d.source]?.x||0).attr('y1',d=>nodeMap[d.source]?.y||0)
    .attr('x2',d=>nodeMap[d.target]?.x||0).attr('y2',d=>nodeMap[d.target]?.y||0)
    .attr('stroke',d=>d.dir==='up'?'#f0883e':'#3fb950').attr('stroke-width',2);

  const nodeG=g.append('g').selectAll('g').data(nodes).join('g')
    .attr('transform',d=>`translate(${d.x},${d.y})`);
  nodeG.append('circle').attr('r',d=>d.id===a.id?14:10)
    .attr('fill',d=>d.id===a.id?'#58a6ff':TC[d.type]||'#8b949e')
    .attr('stroke',d=>d.id===a.id?'#79c0ff':TC[d.type]||'#8b949e').attr('stroke-width',2);
  nodeG.append('text').text(d=>d.label).attr('dy',d=>(d.id===a.id?14:10)+12)
    .attr('text-anchor','middle').attr('fill','#c9d1d9').attr('font-size','10px');
}

/* ===== 事件 ===== */
async function renderEvents(){
  const el=document.getElementById('events-content');
  el.innerHTML='<div style="color:#8b949e">加载中...</div>';
  try{
    const data=await api('/management/memory/events?limit=50');
    let h=`<h3 style="font-size:14px;margin-bottom:12px">事件记忆 (${data.total} 条)</h3>`;
    h+=`<div style="margin-bottom:8px"><input type="text" id="ev-filter" placeholder="搜索事件..." oninput="filterEvents(this.value)" style="background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 8px;border-radius:4px;font-size:12px;width:200px"></div>`;
    h+=`<div id="ev-list">`;
    data.events.forEach(e=>{
      const cls=e.importance>=0.7?'imp-h':'imp-m';
      h+=`<div class="ev" data-fact="${(e.fact+' '+e.keywords.join(' ')).toLowerCase()}">`;
      h+=`<span class="nt nt-${e.type==='strategy'?'cause':'effect'}">${e.type}</span> `;
      h+=`<span style="font-weight:600">${e.fact}</span>`;
      if(e.lesson) h+=`<div style="color:#8b949e;font-size:10px;margin-top:2px">经验: ${e.lesson}</div>`;
      h+=`<div style="font-size:10px;color:#8b949e">`;
      h+=`<span class="imp ${cls}">重要性 ${e.importance.toFixed(1)}</span> `;
      h+=`${e.keywords.map(k=>'#'+k).join(' ')}`;
      if(e.causal_node_ids.length) h+=` <span style="color:#58a6ff">🔗${e.causal_node_ids.length}节点</span>`;
      h+=`</div></div>`;
    });
    h+=`</div>`;
    el.innerHTML=h;
  }catch(e){el.innerHTML=`<div style="color:#f85149">加载失败: ${e.message}</div>`;}
}
function filterEvents(q){
  q=q.toLowerCase();
  document.querySelectorAll('#ev-list .ev').forEach(el=>{
    el.style.display=el.dataset.fact.includes(q)?'':'none';
  });
}

loadData();
</script>
</body>
</html>
