[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logiclink"
version = "0.1.0"
description = "Link language + deterministic checker (v1)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
logiclink = "logiclink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
