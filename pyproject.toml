[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cortex"
version = "0.1.0"
description = "Simplified chat-only AI with memory system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9",
    "anthropic>=0.30",
    "openai>=1.40",
    "dashscope>=1.20",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
cortex = "backend.main:main"

[tool.ruff]
line-length = 120
target-version = "py311"
