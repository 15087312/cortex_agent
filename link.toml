# logiclink 宪法（全仓一份，仅根目录）——试点已扩到 modules/thinking
[scan]
roots = ["app.link", "modules/thinking", "modules/memory", "modules/perception", "modules/output_system", "modules/security_system", "modules/management", "modules/cortex", "modules/desktop_pet", "modules/database", "api", "cortex", "cli_tui", "infra", "tools", "utils"]
exclude = [".venv", "**/node_modules/**", "**/__pycache__/**", "**/test_*.py", "**/*_test.py"]
extensions = [".py", ".link"]

[arch]
forbid_eq_change = true
# W011（弱证据债）的机器上限：超过即 E011。降一条就把这个数字跟着降；
# 想放宽必须有意识地改这一行（而不是靠「大家都记得别加」）。
max_weak_evidence = 6

[atoms.Think]
calls = ["think_fn", "think_once", "think", "llm.invoke", "continuous_think", "_execute_multi_model_thinking", "_review_output", "_run_periodic_check", "_check_impl", "_client.chat", "initialize_system", "start_backend", "chat_stream", "run", "_think", "model", "_model", "_check_llm_review", "_check_high_risk"]

[atoms.Retrieve]
calls = ["retrieve", "_build_prompt", "build_prompt", "get_event_retrieval", "recall", "_recall_memories", "_recall_knowledge", "read_edit_history", "_run_expert_pipeline", "_match_skill", "receive", "receive_text", "embed", "_vector_search", "_causal_search", "_rank_and_filter", "_get_session_conversation", "fetchone", "fetchall", "get_recent_messages", "get_session_metadata", "_build_context", "_load_model", "s.query", "_collect_generic", "_get_caller_permissions", "is_tool_available", "urlopen", "parse_event", "list_tools", "call_tool", "push_sessions", "_port_in_use", "from_pretrained"]
# 低区分度调用名：可作 E002 的证据，但不会被算作「多余 Retrieve 证据」产生 W010。
# 依据 docs/CHECKER_AUDIT.md F1：`ctx.get()` / `fut.result()` 是局部查表与并发等待，
# 不是检索；放进 calls 会让全仓一半 block 误报 W010。
#
# F1b 清完后只留 4 个——每个都对应一个原理上无法强证据的 block（均报 W011）：
#   get          → CtxBuild `d.get`、BusReceive `self._queues.get`
#   to_dict      → BB_ReadDialog `e.to_dict`
#   wait_for     → BusRequest / ChatOnly_Turn 等待 Future/Queue
#   get_instance → PetPersist（真正读库在 PetEngine._last_assistant_same_as 里）
# 其余 12 个泛名（slice/collect/result/__aexit__/gather/popleft/post/get_url/initialize/
# exists/isdir/run_coroutine_threadsafe）已经没有 block 需要，删除——留着就是下一个
# “用泛名盖住未验证声明”的隐藏点。
weak_calls = ["get", "to_dict", "wait_for", "get_instance"]

[atoms.Throttle]
calls = ["sleep"]

[atoms.Tool]
calls = ["_run_tool", "subprocess.run", "Popen", "click", "typewrite", "type_text", "press", "key_down", "key_up", "moveTo", "scroll"]

[atoms.Observe]
calls = ["_observe"]

[atoms.Guard]
requires_branch = true

[atoms.Write]
calls = ["set_working_memory", "record_step", "notebook.append", "write", "save", "_write_final_result", "_save_partial_result", "_dialog_entries.append", "commit", "_save_event_inner", "save_event", "_save_pair", "save_pair", "s.add", "setup_asyncio_handler", "create_engine", "_touch_edge", "add_history", "touch_event", "makedirs", "addHandler", "persist", "_persist_message"]

[atoms.Emit]
calls = ["_notify_thinking_complete", "_notify_return_target", "notify", "_emit_event", "notify_subscribers", "_try_outreach", "generate_and_push", "stream_output", "distribute", "_push_to_ws", "set_exception_handler", "send_json_from_thread", "send_json", "push_screen", "install_screen", "put_nowait", "put"]
returns = true

[ops.Loop]
needs = ["while", "for"]
