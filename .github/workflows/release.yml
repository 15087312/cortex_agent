name: Release

# 推送 v* tag 时自动构建 Windows/macOS 便携包并上传到 GitHub Release。
# 用法: python scripts/release.py patch --tag --push
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        shell: bash
        run: |
          # Windows 上 pip.exe 无法自升级，必须用 python -m pip
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7" PyQt6 PyQt6-WebEngine
          # macOS 无 portaudio，pyaudio 无法编译 → 移除；其余照装
          if [ "$RUNNER_OS" = "macOS" ]; then
            grep -v -E '^pyaudio|pyaudio[<>=]' requirements.txt > reqs.tmp
          else
            cp requirements.txt reqs.tmp
          fi
          python -m pip install -r reqs.tmp

      - name: Build frontend (dist)
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      # 内置 ffmpeg/ffprobe 到 vendor/ffmpeg（pyinstaller.spec 自动收集为 _MEIPASS/ffmpeg）。
      # 失败不阻断发布：缺了则退回用户自装 ffmpeg（doctor 会提示）。
      - name: Vendor ffmpeg
        shell: bash
        run: |
          mkdir -p vendor/ffmpeg
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o ffbin.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" || echo SKIP
            if [ -s ffbin.zip ]; then
              # Windows Git Bash 不保证有 unzip；用系统自带的 PowerShell 解压
              powershell -Command "Expand-Archive -Path ffbin.zip -DestinationPath ffbin -Force" || echo "ffmpeg unzip failed, fallback to user-installed"
              FFMPEG_BIN=$(find ffbin -type f -name ffmpeg.exe 2>/dev/null | head -n 1)
              FFPROBE_BIN=$(find ffbin -type f -name ffprobe.exe 2>/dev/null | head -n 1)
              if [ -n "$FFMPEG_BIN" ] && [ -n "$FFPROBE_BIN" ]; then
                cp "$FFMPEG_BIN" vendor/ffmpeg/ffmpeg.exe
                cp "$FFPROBE_BIN" vendor/ffmpeg/ffprobe.exe
              fi
              rm -rf ffbin
              rm -f ffbin.zip
            fi
            if [ -s vendor/ffmpeg/ffmpeg.exe ] && [ -s vendor/ffmpeg/ffprobe.exe ]; then
              echo "Vendored Windows ffmpeg"
            else
              rm -rf vendor/ffmpeg
            fi
          else
            brew install ffmpeg || echo SKIP
            PREFIX=$(brew --prefix 2>/dev/null)
            if [ -x "$PREFIX/bin/ffmpeg" ] && [ -x "$PREFIX/bin/ffprobe" ]; then
              cp "$PREFIX/bin/ffmpeg" "$PREFIX/bin/ffprobe" vendor/ffmpeg/
              echo "Vendored macOS ffmpeg"
            else
              rm -rf vendor/ffmpeg
            fi
          fi

      - name: PyInstaller
        id: pyi
        shell: bash
        run: |
          set -o pipefail
          # 用 python -m 调起，避免 pip 脚本目录不在 PATH（尤其 macOS runner）
          python -V
          # PyInstaller 拒绝与 obsolete `typing` backport 共存：
          # PyPI 上的 typing 3.7.4.3 是 Python 2/3.4 的历史遗留（被 Resemblyzer 拉进来），
          # 装了它 PyInstaller 直接报 "The 'typing' package is an obsolete backport ..." 退出 1。
          python -m pip uninstall -y typing || true
          python -m PyInstaller --version
          python -m PyInstaller pyinstaller.spec --clean --noconfirm 2>&1 | tee pyinstaller.log

      - name: Upload PyInstaller log
        # 失败时把完整日志留成 artifact：Actions 日志页对未登录用户不可见，
        # 下次排查不用再盲猜。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log-${{ matrix.os }}
          path: pyinstaller.log
          if-no-files-found: ignore

      - name: Report PyInstaller failure
        # artifact / Actions 日志页都需要登录才能下载，排查时经常卡在"拿不到日志"。
        # 这里把失败日志自动贴成一个公开 issue（同一轮重跑会更新同一条），
        # 谁都能直接看，不用再求人手动复制。
        if: ${{ failure() && steps.pyi.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.existsSync('pyinstaller.log')
              ? fs.readFileSync('pyinstaller.log', 'utf8')
              : '(pyinstaller.log 不存在：失败发生在生成日志之前)';
            if (log.length > 60000) log = log.slice(-60000);
            const title = `Release ${context.ref_name} · ${process.env.RUNNER_OS} PyInstaller 失败日志`;
            const body = [
              `自动上报：\`${context.ref_name}\` 在 **${process.env.RUNNER_OS}** 上 PyInstaller 失败。`,
              `commit: ${context.sha}`,
              '',
              '```',
              log,
              '```',
            ].join('\n');
            const list = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const found = list.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Package zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # spec 在 Windows 上走 COLLECT，产物是 dist/cortex/cortex.exe
            test -f cortex/cortex.exe
            powershell -Command "Compress-Archive -Path cortex -DestinationPath ../CortexAgent-windows-${{ github.ref_name }}.zip -Force"
          else
            # spec 在 macOS 上走 BUNDLE，产物是 dist/cortex.app
            test -d cortex.app
            zip -r "../CortexAgent-macos-${{ github.ref_name }}.zip" cortex.app
          fi
          cd ..
          ls -lh CortexAgent-*.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: CortexAgent-*.zip
          generate_release_notes: true
