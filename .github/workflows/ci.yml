name: CI

# 每次 push 到 main / 开 PR 时跑测试（质量门禁）。
# 发布（打 v* tag 构建 + 出包）由 release.yml 负责。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ubuntu 无 portaudio，pyaudio 无法编译；mlx-lm 仅 macOS —— 剔除可选依赖
          grep -v -E '^pyaudio|^pyautogui|mlx-lm' requirements.txt > reqs.tmp
          python -m pip install -r reqs.tmp
          # 测试框架在 requirements-dev.txt；CI 只装运行需要的
          python -m pip install pytest pytest-asyncio pytest-timeout pytest-cov pympler psutil

      # unit / integration 分两个进程跑：合并在同一进程会因非 daemon 线程在退出时挂住
      - name: Run unit tests
        shell: bash
        run: |
          pytest tests/unit -q -p no:cacheprovider

      # 覆盖率门禁：低于阈值 CI 失败（阈值随覆盖提升逐步上调）
      - name: Coverage gate
        shell: bash
        run: |
          pytest tests/unit -q -p no:cacheprovider \
            --cov=modules --cov=infra --cov=config --cov=api --cov=utils \
            --cov-report=term-missing --cov-fail-under=70

      # 类型检查门禁：mypy 0 errors（配置见 pyproject.toml [tool.mypy]）
      - name: Type check (mypy)
        shell: bash
        run: |
          python -m pip install mypy types-PyYAML types-requests
          python -m mypy modules/ infra/ config/ utils/ api/

      - name: Run integration tests
        shell: bash
        run: |
          pytest tests/integration -q -p no:cacheprovider

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + test
        run: |
          cd frontend
          npm ci
          npm test
