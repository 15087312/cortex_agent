name: CI

# 每次 push 到 main / 开 PR 时跑测试（质量门禁）。
# 发布（打 v* tag 构建 + 出包）由 release.yml 负责。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ubuntu 无 portaudio，pyaudio 无法编译；mlx-lm 仅 macOS —— 剔除可选依赖
          grep -v -E '^pyaudio|^pyautogui|mlx-lm' requirements.txt > reqs.tmp
          python -m pip install -r reqs.tmp

      # unit / integration 分两个进程跑：合并在同一进程会因非 daemon 线程在退出时挂住
      - name: Run unit tests
        shell: bash
        run: |
          pytest tests/unit -q -p no:cacheprovider

      - name: Run integration tests
        shell: bash
        run: |
          pytest tests/integration -q -p no:cacheprovider

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + test
        run: |
          cd frontend
          npm ci
          npm test
