name: CI

# 每次 push 到 main / 开 PR 时跑测试（质量门禁）。
# 发布（打 v* tag 构建 + 出包）由 release.yml 负责。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支的新 push 取消上一轮未完成的 CI，避免排队堆积（旧 run 显示 canceled 属正常）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ubuntu 无 portaudio，pyaudio 无法编译；mlx-lm 仅 macOS —— 剔除可选依赖
          grep -v -E '^pyaudio|^pyautogui|mlx-lm' requirements.txt > reqs.tmp
          python -m pip install -r reqs.tmp
          # 测试框架在 requirements-dev.txt；CI 只装运行需要的
          python -m pip install pytest pytest-asyncio pytest-timeout pytest-cov pympler psutil

      # unit / integration 分两个进程跑：合并在同一进程会因非 daemon 线程在退出时挂住
      - name: Run unit tests
        shell: bash
        env:
          CORTEX_TEST_MEM_LIMIT_MB: "4096"
        run: |
          pytest tests/unit -q -p no:cacheprovider

      # 类型检查门禁：mypy 0 errors（配置见 pyproject.toml [tool.mypy]）
      - name: Type check (mypy)
        shell: bash
        run: |
          python -m pip install mypy types-PyYAML types-requests
          python -m mypy modules/ infra/ config/ utils/ api/

      # logiclink 类型门禁：单独一步，18 个源文件 0 error（不改变主工程路径）
      - name: Type check (logiclink)
        shell: bash
        run: |
          python -m pip install mypy
          python -m mypy logiclink/src/

      # 逻辑链接检查门禁：logiclink --strict 全绿；不带 --allow-arch，E305 基线漂移必须失败
      - name: Logic link check (logiclink)
        shell: bash
        run: |
          python -m pip install -e logiclink
          logiclink . --strict

      # logiclink 自身的回归用例（118+），与检查器门禁同批保护
      - name: Logic link unit tests
        shell: bash
        run: |
          python -m pytest logiclink/tests -q -p no:cacheprovider

      - name: Run integration tests
        shell: bash
        run: |
          pytest tests/integration -q -p no:cacheprovider

  # 覆盖率任务带 tracer，明显慢于普通单测；单独成 job 与主测试并行，
  # 并放宽 timeout，避免主 job 超过 30 分钟被整体取消（此前即卡在 coverage 步骤）。
  coverage:
    name: Backend coverage (pytest-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # 失败时把日志贴成公开 issue（Actions 日志页要登录才能看，排查时经常卡住）
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ubuntu 无 portaudio，pyaudio 无法编译；mlx-lm 仅 macOS —— 剔除可选依赖
          grep -v -E '^pyaudio|^pyautogui|mlx-lm' requirements.txt > reqs.tmp
          python -m pip install -r reqs.tmp
          python -m pip install pytest pytest-asyncio pytest-timeout pytest-cov pympler psutil

      # 覆盖率门禁：低于阈值 CI 失败（阈值随覆盖提升逐步上调）
      - name: Coverage gate
        id: coverage
        shell: bash
        env:
          CORTEX_TEST_MEM_LIMIT_MB: "4096"
        run: |
          set -o pipefail
          # --timeout=180：覆盖率 tracer 会让用例慢一截，CI runner 又比开发机慢，
          # pytest.ini 的全局 60s 在这里太紧（v0.2.4 的 coverage job 就是这么挂的）。
          # 真正需要严格超时的重用例已单独在测试文件里放宽到 300s。
          pytest tests/unit -q -p no:cacheprovider \
            --cov=modules --cov=infra --cov=config --cov=api --cov=utils \
            --cov-report=term-missing --cov-fail-under=70 --timeout=180 2>&1 | tee pytest-coverage.log

      - name: Upload coverage log
        # Actions 日志页对未登录用户不可见，失败时留一份 artifact 便于排查。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-log-${{ github.run_id }}
          path: pytest-coverage.log
          if-no-files-found: ignore

      - name: Report coverage failure
        # artifact / Actions 日志页都需要登录才能下载，排查时经常卡在"拿不到日志"。
        # 这里把失败日志自动贴成一个公开 issue（同一轮重跑会更新同一条）。
        if: ${{ failure() && steps.coverage.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.existsSync('pytest-coverage.log')
              ? fs.readFileSync('pytest-coverage.log', 'utf8')
              : '(pytest-coverage.log 不存在：失败发生在生成日志之前)';
            if (log.length > 60000) log = log.slice(-60000);
            const title = `CI ${context.sha.slice(0, 7)} · coverage 失败日志`;
            const body = [
              `自动上报：commit \`${context.sha}\` 的 Backend coverage job 失败。`,
              `run: ${context.runId}`,
              '',
              '```',
              log,
              '```',
            ].join('\n');
            const list = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const found = list.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  frontend:
    name: Frontend tests (Vitest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + test
        run: |
          cd frontend
          npm ci
          npm test

      # UI 交互/可视化冒烟：真实 Chromium + 真实 CSS，覆盖 jsdom 测不到的按钮反馈/计算样式
      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: UI smoke (Playwright)
        run: |
          cd frontend
          npm run test:e2e
