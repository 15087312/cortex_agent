version: '3.8'
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
