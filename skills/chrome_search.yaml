id: chrome_search
name: Chrome 搜索
description: |-
  在 Chrome 浏览器中打开 Google 搜索指定关键词，自动适配 macOS/Windows/Linux 系统。

  ## 适用场景
  - 用户请求在浏览器中搜索某个关键词
  - 需要从 Google 获取实时搜索结果

  ## 不要用于
  - 非搜索类的浏览器操作
  - 本地文件搜索

  ## 规则
  - 仅使用 chrome_search 工具进行搜索操作
  - 搜索前先确认用户需要搜索的关键词

  ## 用法
  调用 chrome_search(query="搜索关键词") 即可
keywords:
  - chrome
  - Chrome
  - 搜索
  - search
  - 谷歌
  - Google
  - 浏览器
trigger:
  include: [chrome, Chrome, 谷歌搜索, Google搜索, 搜一下]
  exclude: [浏览器操作, 浏览器自动化]
  min_score: 1
metadata:
  version: 1
  type: builtin
